#"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
format = "${custom.remote_identity}$directory([::](bold blue) $vcs)$package$character"

[vcs]
order = ["jj", "git"]
git_modules = "$git_branch$git_status"

[custom.remote_identity]
description = "Show user@machine on computers other than the main Mac"
shell = ["sh"]
when = 'case "$(hostname -s)" in MacBookPro|obook) exit 1 ;; *) exit 0 ;; esac'
command = 'printf "%s@%s" "$(id -un)" "$(hostname -s 2>/dev/null || hostnamectl --static 2>/dev/null || unknown)"'
format = "[$output]($style) "
style = "bold yellow"

[git_metrics]
disabled = false

[directory]
style = "bold blue"
read_only = " "
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$symbol$branch]($style) "
style = "bold blue"

[package]
format = "[$symbol$version]($style) "

[character]
success_symbol = "[|](bold blue)"
error_symbol = "[|](bold red)"
format = "$symbol "

[memory_usage]
symbol = " "

[aws]
disabled = true

[gcloud]
disabled = true
