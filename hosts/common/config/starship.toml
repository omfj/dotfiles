#"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
format = "$username$hostname$directory([::](bold blue) $git_branch$git_status)$package$character"

[git_metrics]
disabled = false

[directory]
style = "bold blue"
read_only = " "
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$symbol$branch]($style) "
style = "bold blue"

[package]
format = "[$symbol$version]($style) "

[character]
success_symbol = "[|](bold blue)"
error_symbol = "[|](bold red)"
format = "$symbol "

[memory_usage]
symbol = " "

[aws]
disabled = true

[gcloud]
disabled = true
